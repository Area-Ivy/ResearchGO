http:
  routers:
    agent-router:
      rule: "PathPrefix(`/api/agent`)"
      service: agent-service
      entryPoints:
        - web
      middlewares:
        - cors-headers

    memory-router:
      rule: "PathPrefix(`/api/memory`)"
      service: agent-service
      entryPoints:
        - web
      middlewares:
        - cors-headers

    dashboard-router:
      rule: "PathPrefix(`/api/dashboard`)"
      service: agent-service
      entryPoints:
        - web
      middlewares:
        - cors-headers

    system-router:
      rule: "PathPrefix(`/api/system`)"
      service: agent-service
      entryPoints:
        - web
      middlewares:
        - cors-headers

    auth-router:
      rule: "PathPrefix(`/api/auth`)"
      service: auth-service
      entryPoints:
        - web
      middlewares:
        - cors-headers

    conversation-router:
      rule: "PathPrefix(`/api/conversations`)"
      service: conversation-service
      entryPoints:
        - web
      middlewares:
        - cors-headers

    paper-router:
      rule: "PathPrefix(`/api/papers`)"
      service: paper-service
      entryPoints:
        - web
      middlewares:
        - cors-headers

    vector-router:
      rule: "PathPrefix(`/api/vector`)"
      service: vector-service
      entryPoints:
        - web
      middlewares:
        - cors-headers

    milvus-router:
      rule: "PathPrefix(`/api/milvus`)"
      service: vector-service
      entryPoints:
        - web
      middlewares:
        - cors-headers

    literature-router:
      rule: "PathPrefix(`/api/literature`)"
      service: literature-service
      entryPoints:
        - web
      middlewares:
        - cors-headers

    mindmap-router:
      rule: "PathPrefix(`/api/mindmap`)"
      service: mindmap-service
      entryPoints:
        - web
      middlewares:
        - cors-headers

    analysis-router:
      rule: "PathPrefix(`/api/analysis`)"
      service: analysis-service
      entryPoints:
        - web
      middlewares:
        - cors-headers

  services:
    agent-service:
      loadBalancer:
        servers:
          - url: "http://agent-service:8000"
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"

    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth-service:8001"
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"

    conversation-service:
      loadBalancer:
        servers:
          - url: "http://conversation-service:8002"
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"

    paper-service:
      loadBalancer:
        servers:
          - url: "http://paper-storage-service:8003"
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"

    vector-service:
      loadBalancer:
        servers:
          - url: "http://vector-search-service:8004"
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"

    literature-service:
      loadBalancer:
        servers:
          - url: "http://literature-search-service:8005"
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"

    mindmap-service:
      loadBalancer:
        servers:
          - url: "http://mindmap-service:8007"
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"

    analysis-service:
      loadBalancer:
        servers:
          - url: "http://analysis-service:8008"
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"

  middlewares:
    cors-headers:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
          - "PATCH"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-Requested-With"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 3600
        addVaryHeader: true

    rate-limit:
      rateLimit:
        average: 100
        burst: 50

    retry:
      retry:
        attempts: 3
        initialInterval: "100ms"
